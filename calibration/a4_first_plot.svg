<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="297mm"
  height="210mm"
  viewBox="0 0 297 210"
  version="1.1">
  <g
    inkscape:groupmode="layer"
    inkscape:label="calibration"
    fill="none"
    stroke="#000000"
    stroke-width="0.3"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- After vpype-gcode's vertical flip, this cross is at physical (10, 10) mm. -->
    <path d="M 7,200 H 13 M 10,197 V 203"/>

    <!-- 20 x 20 mm square, with diagonals to reveal skew or missed steps. -->
    <path d="M 20,190 H 40 V 170 H 20 Z"/>
    <path d="M 20,190 L 40,170 M 20,170 L 40,190"/>

    <!-- Horizontal 100 mm ruler: physical X=20..120 mm, Y=60 mm. -->
    <path d="M 20,150 H 120"/>
    <path d="M 20,146 V 154 M 30,148 V 152 M 40,148 V 152 M 50,148 V 152 M 60,148 V 152 M 70,146 V 154 M 80,148 V 152 M 90,148 V 152 M 100,148 V 152 M 110,148 V 152 M 120,146 V 154"/>

    <!-- Vertical 100 mm ruler: physical X=150 mm, Y=20..120 mm. -->
    <path d="M 150,190 V 90"/>
    <path d="M 146,190 H 154 M 148,180 H 152 M 148,170 H 152 M 148,160 H 152 M 148,150 H 152 M 146,140 H 154 M 148,130 H 152 M 148,120 H 152 M 148,110 H 152 M 148,100 H 152 M 146,90 H 154"/>

    <!-- Three separated marks verify that the pen lifts cleanly during travel. -->
    <path d="M 60,190 H 64 M 62,188 V 192"/>
    <path d="M 80,180 H 84 M 82,178 V 182"/>
    <path d="M 100,170 H 104 M 102,168 V 172"/>
  </g>
</svg>
