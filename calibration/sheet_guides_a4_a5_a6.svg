<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="297mm"
  height="210mm"
  viewBox="0 0 297 210"
  version="1.1">
  <g
    inkscape:groupmode="layer"
    inkscape:label="sheet-guides"
    fill="none"
    stroke="#000000"
    stroke-width="0.3"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- A4 max plotter envelope, corners only. -->
    <path d="M 0,0 H 8 M 0,0 V 8"/>
    <path d="M 297,0 H 289 M 297,0 V 8"/>
    <path d="M 0,210 H 8 M 0,210 V 202"/>
    <path d="M 297,210 H 289 M 297,210 V 202"/>

    <!-- A5 landscape, bottom-left aligned in machine coordinates: 210 x 148 mm. -->
    <rect x="0" y="62" width="210" height="148"/>
    <path d="M 0,62 H 6 M 0,62 V 68"/>
    <path d="M 210,62 H 204 M 210,62 V 68"/>
    <path d="M 0,210 H 6 M 0,210 V 204"/>
    <path d="M 210,210 H 204 M 210,210 V 204"/>

    <!-- A6 landscape, bottom-left aligned in machine coordinates: 148 x 105 mm. -->
    <rect x="0" y="105" width="148" height="105"/>
    <path d="M 0,105 H 6 M 0,105 V 111"/>
    <path d="M 148,105 H 142 M 148,105 V 111"/>
    <path d="M 0,210 H 6 M 0,210 V 204"/>
    <path d="M 148,210 H 142 M 148,210 V 204"/>
  </g>
</svg>
