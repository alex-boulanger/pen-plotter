[project]
name = "pen-plotter"
version = "0.1.0"
description = "Generative pen-plotting sketches and a reproducible SVG-to-G-code toolchain."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Boulanger" }]
dependencies = [
    "numpy",
    "pillow",
    "pysometric",
    "requests>=2.34.2",
    "shapely",
    "vpype",
    "vpype-gcode>=0.13.0",
    "vsketch",
]

[project.urls]
Repository = "https://github.com/alex-boulanger/pen-plotter"

[tool.uv]
package = false

[tool.uv.sources]
pysometric = { git = "https://github.com/svoisen/pysometric.git" }
